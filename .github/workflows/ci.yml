# PR 品質門檻 — main 的 required status check（docs/DEV.md）。
# 純前端檢查，不碰私有 repo；桌面合成驗證見 desktop-ci.yml。
name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck + build
        run: pnpm run build

      - name: Unit tests
        run: pnpm test

  gateway:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autotrade_test
          POSTGRES_PASSWORD: autotrade_test_local_only
          POSTGRES_DB: autotrade_test
        options: >-
          --health-cmd "pg_isready -U autotrade_test -d autotrade_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      AUTOTRADE_GATEWAY_TEST_POSTGRES_DSN: postgresql://autotrade_test:autotrade_test_local_only@127.0.0.1:5432/autotrade_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v6

      - name: Install Gateway test dependencies
        run: uv sync --frozen --group dev

      - name: Gateway lint and typecheck
        run: |
          uv run ruff check services/autotrade_gateway
          uv run mypy

      - name: Gateway unit and PostgreSQL integration tests
        run: uv run python -m unittest discover -s services/autotrade_gateway -p 'test_*.py'

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Desktop and mobile observer E2E
        run: pnpm test:e2e
